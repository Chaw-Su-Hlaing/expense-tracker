spring:
  application:
    name: expense-tracker-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: http://localhost:5173

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:expensetracker;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expensetracker}
    username: ${DB_USERNAME:expensetracker}
    password: ${DB_PASSWORD:expensetracker}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
